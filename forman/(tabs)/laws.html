r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Без лицензии можно делать только работу, если общая цена (труд + материалы + всё прочее) меньше $1,000 И работа не требует building permit (7048(a)). Исключение не действует, если работа — часть большей работы или её делят на куски, чтобы обойти закон (7048(b)), если человек рекламирует себя как подрядчика или нанимает помощника (7048(c)). Замена или установка HVAC, которой нужен permit, под исключение не попадает.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Реклама без лицензии нужного класса</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Misdemeanor — рекламировать работы без действующей лицензии в рекламируемом классе (7027.1(a)). &#x27;Реклама&#x27; включает визитки, знаки на зданиях, справочники и любую электронную передачу (7027.1(b)). Штраф от $700 до $1,000 (7027.1(c)). Рекламировать HVAC-установку можно только под лицензией C-20 (или B, если работа подходит под B).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Workers&#x27; comp обязателен для C-20 даже без сотрудников</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Освобождение &#x27;нет сотрудников — нет workers&#x27; comp&#x27; не действует для C-8, C-20, C-22, C-39, D-49 (7125(b)(2)). Лицензия C-20 требует действующего Certificate of Workers&#x27; Compensation Insurance в CSLB. С 01.01.2028 действует новая редакция 7125; освобождение в ней видно только для joint venture без сотрудников. Остальной текст новой редакции не проверен.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Contractor&#x27;s bond $25,000</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Для выдачи, продления и сохранения лицензии нужен contractor&#x27;s bond на $25,000 (7071.6(a)). По претензиям, кроме особых бенефициаров по 7071.5(a), выплата ограничена $7,500 (7071.6(b)). Для неактивной лицензии bond не нужен (7071.6(c)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Регистрация продавца (Home Improvement Salesperson)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Misdemeanor — продавать для home improvement contractor без действующей регистрации HIS на момент продажи (7153(a)). Регистратор может выписать citation. В договоре указываются имя и номер регистрации HIS, если продажу вёл он (7159(d)(2)). Продавцы и комфорт-консультанты, которые подписывают договоры с домовладельцами, должны быть зарегистрированы.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Что разрешает лицензия C-20</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">По C-20 можно изготавливать, ставить, обслуживать и ремонтировать: воздушное отопление и тепловые насосы для нагрева воды (water heating heat pumps); вентиляцию с вентиляторами и plenum; кондиционирование вместе с блоком; воздуховоды, решётки, дымоходы (flues), увлажнение, термостаты и фильтры этих систем; такие же системы на солнечной энергии.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Тепловые насосы: какая лицензия нужна</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">HVAC heat pump ставит только C-20. Heat pump water heater ставит C-20 или C-36. B (General Building) может взять такой договор, но обязан отдать работу на субподряд C-20 или C-36. Исключение: в договоре две и больше несвязанные специальности, кроме framing и carpentry. C-10 может сделать panel upgrade, но не может заключать договор на тепловой насос.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Холод ниже 50°F — это лицензия C-38</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">C-38 Refrigeration ставит холодильные камеры, изоляцию, блоки, воздуховоды и автоматику для температур ниже 50°F (10°C). Walk-in cooler или freezer — работа C-38, не C-20.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Опыт: 4 года journeyman за последние 10 лет</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Квалификатор должен иметь не меньше 4 лет опыта как journeyman, foreman, supervising employee или contractor в классе C-20. Опыт считается за 10 лет прямо перед подачей заявления. Journeyman — полностью квалифицированный работник (не ученик), который работает без надзора, или тот, кто закончил apprenticeship. Бывший qualifier той же классификации считает опыт без ограничения в 10 лет. Время службы в армии США во время National Emergency добавляется к 10 годам.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Учёба и apprenticeship — максимум 3 года из 4</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Аккредитованная школа или утверждённый apprenticeship засчитываются максимум за 3 года опыта. По странице CSLB: associate degree — до 1,5 года; четырёхлетний диплом или курсы колледжа — до 2 лет; сертификат apprenticeship — до 3 лет. Минимум 1 год должен быть практическим. Школьные (high school) курсы не засчитываются.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Кто подписывает опыт; случайная проверка 3%</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Опыт подтверждают на форме Certification of Work Experience. Подписывает человек, который лично видел вашу работу: работодатель, коллега, journeyman, подрядчик, представитель профсоюза, инспектор, архитектор или инженер; если вы работали на себя — заказчик. CSLB по закону случайно проверяет 3% заявлений. Опыт должен подтверждаться payroll records или похожими документами. CSLB может позвонить тому, кто подписал. Держите W-2, pay stubs и 1099 наготове.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Квалификатор-работник (RME): 32 часа в неделю</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">RME должен быть bona fide employee, то есть работать у заявителя постоянно. Он должен быть actively engaged: 32 часа в неделю или 80% рабочих часов бизнеса, что меньше. Квалификатор не может одновременно держать другую активную лицензию, кроме случаев по §7068.1.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Порядок получения лицензии, сроки и пересдача</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Семь шагов: 1) проверить, подходите ли вы (18+, 4 года опыта, SSN или ITIN); 2) собрать документы об опыте; 3) заполнить заявление 13A-1; 4) оплатить $450; 5) сдать отпечатки Live Scan, когда CSLB примет заявление; 6) сдать два компьютерных экзамена, Law &amp; Business и C-20; 7) получить лицензию: заплатить initial fee, подать bond и workers&#x27; comp. Экзамены проводит PSI, оплата напрямую PSI. На сдачу даётся 18 месяцев после одобрения. Между попытками ждать 21 день. Пропуск или пересдача — $100 за каждую новую запись. Переводчика на экзамен можно запросить в Field 16 заявления.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Сборы CSLB</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Заявление $450. Initial license: $200 sole owner или $350 non-sole owner. Ещё одна классификация в первом заявлении (waiver или joint venture) — $150. Новая классификация к действующей лицензии — $230. Замена квалификатора — $230. Live Scan: DOJ $32 + FBI $17 + плата пункта. Продление active: $450 sole owner или $700 non-sole owner. Суммы $450, $200 и $350 совпадают с формой 13A-1 rev. 01/2026.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Bonds: $25,000 и дополнительные</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Contractor&#x27;s bond на $25,000 обязателен, чтобы получить, продлить и держать лицензию. Для неактивной лицензии он не нужен. Ещё $25,000 bond of qualifying individual, если квалифицирует RME. Для LLC дополнительно worker bond на $100,000 и страховка ответственности: $1 млн в сумме, если в лицензии до 5 человек; плюс $100 000 за каждого следующего; всего не больше $5 млн.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Workers&#x27; comp обязателен для C-20 даже без работников</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Обычный подрядчик без работников может подать exemption. Держатель C-20 — нет: освобождение не действует для C-8, C-20, C-22, C-39 и D-49. В CSLB всё время должен лежать действующий Certificate of Workers&#x27; Compensation Insurance или Certification of Self-Insurance на имя бизнеса. Иначе лицензию не выдадут и не продлят.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">SSN или ITIN; статус иммиграции не спрашивают</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Заявитель-физлицо даёт SSN или ITIN. Совет не может требовать сведения о гражданстве или иммиграционном статусе. Совет не может отказать в лицензии только из-за этого статуса. Без SSN, ITIN или FEIN заявление не обработают.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Экзамен Law &amp; Business: темы и веса</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Веса разделов: Business Organization and Licensing 13%; Business Finances 15%; Employment Requirements 20%; Insurance and Liens 12%; Contract Requirements and Execution 21%; Public Works 5%; Safety 14%. Экзамен closed-book: свои материалы брать нельзя. Вопросы с выбором из 4 вариантов, калькулятор дают на месте. Study guide бесплатный, на английском и испанском.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Экзамен C-20: темы, веса и книги</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Веса разделов: Planning and Estimating 22% (нагрузки, психрометрия, проект воздуховодов, смета); Fabrication, Installation, and Startup 38%; Troubleshooting, Repair, and Maintenance 20%; Safety 20% (PPE, Cal/OSHA, опасные материалы). Экзамен closed-book, калькулятор дают на месте. Литература: 2025 California Building, Electrical, Energy, Mechanical, Plumbing Code; 2025 Building Energy Efficiency Standards; Cal/OSHA Title 8; ACCA Manual J, D, S, H, N, P, Q, RS, CS; SMACNA; ASHRAE.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Когда экзамен можно не сдавать; reciprocity</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Trade exam могут отменить (waiver) по B&amp;P 7065–7065.4, например если квалификатор в последние 5 лет был активно занят в строительстве и подходит под условия закона. Для этого есть отдельная форма 13A-1A. При reciprocity с другим штатом Law &amp; Business всё равно нужно сдать, если вы не сдавали его в последние 5 лет.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">CALGreen: Manual J/D/S и обучение монтажников HVAC</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Для новых жилых зданий: нагрузка по ANSI/ACCA 2 Manual J-2016, воздуховоды по ANSI/ACCA 1 Manual D-2016, оборудование по ANSI/ACCA 3 Manual S-2014 (или ASHRAE и эквиваленты). Альтернативные расчётные температуры допускаются, если они нужны для работы системы. Монтажники HVAC должны быть обучены и сертифицированы по признанной программе: государственный apprenticeship, энергокомпании, отраслевые программы, производители. Обратите внимание: в Energy Code §150.0(h)5 указан Manual S-2023.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Что входит в лицензию C-20</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">C-20 делает изготовление, монтаж, обслуживание и ремонт систем воздушного отопления и heat pump для нагрева воды, вентиляции (с вентиляторами и plenum) и кондиционирования вместе с агрегатом. Сюда же входят воздуховоды, решётки, flues, увлажнение, термостаты и фильтры этих систем, в том числе на солнечной энергии. Работа за этими рамками относится к другой классификации.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Электрика под C-20: только incidental and supplemental</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Специалист-подрядчик может брать договор с работами других ремёсел, если они «incidental and supplemental» к основной работе (B&amp;P 7059(a)). Работа считается такой, если она «essential to accomplish the work in which the contractor is classified». Её делают свои работники или субподрядчик (16 CCR 831). Наш вывод, не текст закона: подключить агрегат к готовой линии — обычно допустимо. Новая линия от щита, замена щита или апгрейд сервиса — спорно, в таких случаях брать C-10 или спрашивать CSLB.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">RRP: сертификация фирмы и записи</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Фирма, которая выполняет renovations за плату, подает заявку на сертификацию в EPA. Сертификат выдается на срок не больше 5 лет. Все записи по RRP хранятся 3 года после окончания работ.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">CA: сертификация CDPH по lead-related construction</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Раздел не проверен. По сниппетам поиска со страниц CDPH: certified Lead Supervisor или Worker (CDPH LRC) нужен для работ, цель которых — уменьшить или устранить свинцовую опасность (abatement). Сертификаты других штатов в CA не действуют. Страницы CDPH не открылись (HTTP 503 и ошибка TLS-цепочки). Проверить вручную.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Регистрация в DOSH при 100 sq ft и больше</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Работодатель, который ведет asbestos-related work с 100 sq ft и больше асбестосодержащего материала на одном объекте, обязан до начала работ зарегистрироваться в DOSH. Регистрация действует 1 год. ACCM — материал с содержанием асбеста больше 1/10 от 1 % по весу. Подрядчик должен быть сертифицирован по B&amp;P 7058.5.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Лицензия CSLB: асбест (C-22 или сертификация, open book экзамен)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Подрядчик не может выполнять asbestos-related work от 100 sq ft без классификации C-22 Asbestos Abatement или без сданного qualifier asbestos certification exam. Все кандидаты на первичную лицензию CSLB проходят открытый (open book) экзамен по асбесту по буклету CSLB.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">IIPP: письменная программа безопасности</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">У фирмы должна быть письменная Injury and Illness Prevention Program. Минимальный набор пунктов: ответственное лицо; как добиваться соблюдения правил; как общаться с рабочими, чтобы они сообщали об опасностях без страха наказания; регулярные проверки; расследование травм; устранение опасностей; обучение; доступ работников к программе. Обучать нужно новых работников, при новой работе, при новом веществе или оборудовании, при новой опасности. Бригадиров обучают опасностям, которым подвергаются их люди. Записи о проверках и об обучении хранятся не менее 1 года; для фирм, где меньше 10 работников, есть упрощения. На стройке IIPP прямо требует §1509(a).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Заявитель permit: лицензия или основание освобождения</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Город или округ, который выдаёт permit, обязан требовать от заявителя подписанное заявление: что он лицензирован (номер, лицензия действующая) или на каком основании освобождён. За нарушение — civil penalty «not more than five hundred dollars ($500)». В городе San Diego owner-builder подписывает DS-3042 до выдачи permit (IB 103).</div></button></div></div></div></div><!--/$--></div></div></div></div><div class="css-g5y9jx r-1p0dtai r-zchlnj r-1d2f490" style="pointer-events:auto;border-right-color:rgba(216,216,216,1.00);border-bottom-color:rgba(216,216,216,1.00);border-left-color:rgba(216,216,216,1.00);padding-top:0px;padding-right:0px;padding-left:0px;height:66px;padding-bottom:0px;border-top-width:1.5px;border-top-color:rgba(85,98,94,1.00);background-color:rgba(255,255,255,1.00);transform:translateY(0px)"><div class="css-g5y9jx r-1p0dtai r-1d2f490 r-u8s1d r-zchlnj r-ipm5af r-633pao"></div><div role="tablist" class="css-g5y9jx r-13awgt0 r-18u37iz"><div class="css-g5y9jx r-13awgt0" style="border-top-left-radius:0px;border-top-right-radius:0px;border-bottom-right-radius:0px;border-bottom-left-radius:0px;overflow-x:visible;overflow-y:visible;padding-right:0px;padding-left:0px"><a href="/fixpro-sklad-app/forman/" role="tab" aria-selected="false" tabindex="0" class="css-g5y9jx r-1otgn73 r-1awozwy r-1onu96p r-eqz5dr r-1h0z5md r-1uu6nss" style="cursor:pointer;flex:1;background-color:rgba(0,0,0,0.00);border-top-left-radius:0px;border-top-right-radius:0px;border-bottom-right-radius:0px;border-bottom-
