o" class="css-146c3p1 r-1mnal2x r-1inkyih r-b88u0q">электрика</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-k200y r-14lw9ot r-1u10qnf r-t23y2h r-d045u9 r-1777fci r-10gryf7 r-3pj75a" type="button"><div dir="auto" class="css-146c3p1 r-1mnal2x r-1inkyih r-b88u0q">газ и дымоудаление</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-k200y r-14lw9ot r-1u10qnf r-t23y2h r-d045u9 r-1777fci r-10gryf7 r-3pj75a" type="button"><div dir="auto" class="css-146c3p1 r-1mnal2x r-1inkyih r-b88u0q">тесты и пуск</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-k200y r-14lw9ot r-1u10qnf r-t23y2h r-d045u9 r-1777fci r-10gryf7 r-3pj75a" type="button"><div dir="auto" class="css-146c3p1 r-1mnal2x r-1inkyih r-b88u0q">документы, permit и сдача</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-k200y r-14lw9ot r-1u10qnf r-t23y2h r-d045u9 r-1777fci r-10gryf7 r-3pj75a" type="button"><div dir="auto" class="css-146c3p1 r-1mnal2x r-1inkyih r-b88u0q">клиент</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-k200y r-14lw9ot r-1u10qnf r-t23y2h r-d045u9 r-1777fci r-10gryf7 r-3pj75a" type="button"><div dir="auto" class="css-146c3p1 r-1mnal2x r-1inkyih r-b88u0q">бизнес и лицензия</div></button></div></div><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-k200y r-14lw9ot r-1u10qnf r-t23y2h r-d045u9 r-1777fci r-10gryf7 r-3pj75a" type="button"><div dir="auto" class="css-146c3p1 r-1mnal2x r-1inkyih r-b88u0q">Режим подготовки к C-20</div></button><div dir="auto" class="css-146c3p1 r-1u12321 r-1inkyih r-1qh4ar0">Показано 208 из 208 · проверено 18.11.2026</div><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Номер лицензии на траке и в рекламе</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Номер лицензии обязателен во всех контрактах, субконтрактах, calls for bid и всей рекламе (7030.5). Реклама по 16 CCR 861 включает &#x27;lettering on vehicles&#x27;, визитки, proposals, вывески и электронную рекламу. Поэтому если на траке есть надпись компании, на нём должен быть номер лицензии. Отдельная норма B&amp;P 7029.5 (имя, адрес и номер, буквы от 1½ дюйма, с обеих сторон машины) касается только C-36, C-45, C-57, не C-20.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Баллоны (азот, ацетилен, кислород, хладагент): хранение и перемещение</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Баллоны не должны опрокидываться, падать и катиться ни на складе, ни при перевозке; баллон в работе закреплён в стойке или к жёсткой конструкции. Колпак вентиля ставят, когда баллон не используется. Перед перемещением снять регулятор и поставить колпак, если баллон не на специальной тележке или стойке. Вентиль закрывают перед перемещением и после работы. На складе кислород отделяют от горючего газа на 20 футов или негорючей стенкой высотой не меньше 5 футов. Баллоны не держат в непроветриваемых шкафах.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Баллоны в рабочей машине: DOT materials of trade</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Газ Division 2.1 или 2.2 в баллоне весом брутто не больше 100 кг (220 фунтов) можно возить как material of trade; тогда остальные требования HMR не применяются, кроме перечисленных в §173.6. Все materials of trade в одной машине — не больше 200 кг (440 фунтов) брутто. Баллоны закрыты, закреплены от смещения, защищены от повреждений. Баллон соответствует требованиям DOT, внешняя упаковка не нужна. Баллон DOT-спецификации маркирован и с этикеткой. Водителя предупреждают о грузе и знакомят с правилами. Если пределы превышены, применяются все HMR, например §177.834(a) о креплении груза и (e) о ручнике при погрузке.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Цвет бордюра</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Красный: нельзя останавливаться, стоять и парковаться, даже если водитель в кабине. Жёлтый: только погрузка и разгрузка пассажиров или груза, на время из местного закона. Белый: только посадка и высадка пассажиров или опустить почту. Зелёный: парковка с ограничением по времени. Синий: только для инвалидов. Дни и часы действия цвета задаёт местный закон и указывают знаки.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Жёлтая коммерческая зона в городе San Diego</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В Commercial Loading Zone может стоять только машина, которая зарегистрирована в DMV как коммерческая. На разгрузку материалов даётся не больше 20 минут, на пассажиров не больше 3 минут. Зона работает с 6:00 до 18:00, кроме праздников, если на знаке не указаны другие часы. Если трак на обычных номерах, в жёлтую зону не вставать.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Въезды, тротуар, переход, пандусы</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нельзя стоять на переходе и перед любым въездом, частным или общественным, в том числе перед въездом соседа клиента. Нельзя стоять на тротуаре или так, чтобы кузов нависал над тротуаром. Зеркала и обязательные фонари могут выступать над тротуаром не больше чем на 10 дюймов. Нельзя стоять перед опущенным бордюром для колясок. Нельзя ближе 3 футов к пандусу тротуара, если место обозначено знаком или красной краской.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">20 футов до перехода (daylighting)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нельзя стоять ближе 20 футов к переходу со стороны подъезда машин. Это касается и размеченного, и неразмеченного перехода. Если у перехода есть выступ бордюра, нельзя ближе 15 футов. Город может задать другое расстояние, но только по своему закону и с разметкой. До 01.01.2025 за это давали только предупреждение, если место не было размечено. Теперь выписывают штраф.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Пожарный гидрант и пожарные проезды</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нельзя стоять ближе 15 футов к гидранту. Исключение: водитель с правами сидит на переднем сиденье и может сразу отъехать. Нельзя стоять в обозначенной fire lane, в том числе на частной парковке. В городе San Diego нельзя ставить машину в Fire Apparatus Access Roadway в любое время, на частной и на общественной земле.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Двойная парковка, раскоп, двери</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нельзя ставить машину рядом с припаркованной машиной со стороны дороги. Нельзя вставать у раскопа или препятствия, если это мешает движению. Дверь со стороны движения открывать, только когда это безопасно и не мешает движению. Долго её открытой не держать.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">18 дюймов от бордюра, не против движения</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Правые колёса ставить параллельно бордюру и не дальше 18 дюймов от него. Коммерческая машина может отступить от этого правила, но только пока это действительно нужно для погрузки или разгрузки. Против движения вставать нельзя никогда.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Трак без водителя, уклон</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Уходите от машины: заглушить мотор и поставить на ручник. В городе San Diego на уклоне больше 3% передние колёса повернуть в бордюр, чтобы машина не покатилась.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Тяжёлый трак (GVWR от 10 000 lb) в жилом районе</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Закон штата разрешает городу запрещать коммерческие машины с GVWR 10 000 lb и больше на улицах жилых районов, но не для доставки и не для ремонта или стройки по выданному permit. Город San Diego запрещает ставить такой трак на улице жилого района. Есть три исключения: машина грузится или разгружается; бригада обслуживает участок в этом же квартале; машина стоит у коммерческого или промышленного объекта. Трак ставить в квартале объекта и на ночь у дома не оставлять.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Oversized: длиннее 27 футов и выше 7 футов</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Oversized vehicle — это машина вместе с прицепом и грузом длиннее 27 футов и выше 7 футов. Такую машину на улице города нельзя ставить с 2:00 до 6:00. Исключения: погрузка или работа на участке в этом же квартале. Ближе 50 футов к перекрёстку её нельзя ставить в любое время, и исключение «работаем в квартале» на это правило не распространяется. Запреты действуют, когда стоят знаки.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Прицеп на улице ночью</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Любой прицеп по SDMC считается non-motorized vehicle. Прицеп на улице города нельзя оставлять с 2:00 до 6:00. Ближе 50 футов к перекрёстку его нельзя ставить в любое время. Исключения «работаем в квартале» для прицепа в тексте нет, оно написано только для oversized. Прицеп на ночь на улице не оставлять.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Не дольше 72 часов на одном месте</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Любую машину нельзя держать на одном месте улицы больше 72 часов подряд. Если местный закон это разрешает, такую машину эвакуируют.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Переулок (alley)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В переулке стоять только на время активной разгрузки: не дольше 20 минут на материалы и 3 минут на пассажиров. Исключение: зона Alley Parking Zone со знаком. Проезд для экстренных служб не перекрывать.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Груз выступает назад: флаг и фонари</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если груз (трубы, лестницы, линии) выступает на 4 фута и больше за задние фонари: днём на конце груза нужен сплошной красный или флуоресцентно-оранжевый флаг не меньше 18 дюймов; в темноте нужны два красных фонаря, видных с 500 футов. Если груз шириной до 2 футов, нужен 1 флаг. Если шире, нужны 2 флага по краям.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Груз закреплён; высота с рейлингом</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Машину нельзя вести, если из неё может что-то упасть, высыпаться, вытечь, вылететь или улететь ветром: лестницы, трубы, старый блок, мусор. Всё закреплять и накрывать. Машина вместе с грузом не выше 14 футов от дороги. Если выше 13 футов 6 дюймов, ехать только там, где это безопасно.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">дорога и парковка</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Холостой ход дизельного трака</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Правило для дизельного коммерческого трака с GVWR больше 10 000 lb. С 2015 г. мотор на холостых не больше 5 минут подряд в любом месте. По требованию инспектора водитель показывает права, регистрацию и данные перевозчика. Исключения есть, например: пробка; мотор через PTO крутит подъёмник, кран, насос или другое оборудование; проверка, ремонт или регенерация фильтра. Restricted area — это участки под жильё, школы, больницы и т.п.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">приезд и объект</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Замкнутые пространства: воздуховоды, подполье</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В примечании к §1950(a) воздуховоды HVAC прямо названы местом, где может быть confined space. Подполье и чердак в тексте не названы. До начала работ competent person обязан определить все замкнутые пространства и выделить те, куда нужен допуск (permit spaces).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">приезд и объект</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Двор клиента, чужой подъезд, парквей</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Во дворе или на подъезде частного участка можно стоять только с прямого или подразумеваемого согласия владельца. На парквее (полоса между тротуаром и границей участка) ставить машину только перпендикулярно бордюру, в продолжении подъезда. Машина не должна выступать на улицу или тротуар. Пожарным надо оставить проезд по левой стороне подъезда.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">приезд и объект</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Часы шумных работ в городе San Diego</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Без разрешения Noise Abatement and Control Administrator нельзя шумно строить или ремонтировать: с 19:00 до 7:00, в воскресенье и в праздники по SDMC §21.0104 (кроме Columbus Day и Washington&#x27;s Birthday). С 7:00 до 19:00 средний уровень за 12 часов на границе жилого участка не выше 75 dB. Construction Noise Permit стоит $529.71. Нужно уведомить всех в радиусе 500 футов не позже чем за 72 часа, и сначала получить Traffic Control Permit, если он нужен.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">приезд и объект</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Часы шумных работ в округе (unincorporated)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нельзя работать строительным оборудованием с 19:00 до 7:00, в воскресенье и в праздники. Праздники: 1 января, последний понедельник мая, 4 июля, первый понедельник сентября, 25 декабря и особые дни, которые объявят президент или губернатор. Исключение — экстренные работы. С 7:00 до 19:00 средний уровень за 8 часов не выше 75 dB на границе участка или на занятом участке, где слышно. Официальный текст кодекса я не открывал.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">приезд и объект</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Что должно быть на объекте при инспекции (город)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">На месте должны быть «Approved plans and documents», inspection record card и взрослый 18+ для доступа. «Ladders and scaffolds shall comply with … OSHA standards». Щиты и junction boxes «open and accessible for inspection».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Агрегат на крыше: расстояние до края и ограждение</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">От любой части агрегата до края крыши нужно не меньше 6 ft, иначе ставят жёсткое ограждение или парапет высотой не меньше 42 in. Ограждение обязательно, если до края меньше 6 ft или открытый край площадки выше 30 in. Оно не должно пропускать шар диаметром 21 in и должно выступать на 30 in за каждую сторону агрегата. Исключение: стационарная анкерная точка для страховки по ASSP Z359.1. Поверхность под агрегатом должна иметь хороший сток. Крепёж панелей делают коррозионно-стойким.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Старая изоляция воздуховодов и котлов = PACM</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Thermal system insulation и surfacing material в зданиях, построенных не позже 1980 г., считаются асбестосодержащими (PACM), пока это не опровергнуто по (k)(5). TSI включает изоляцию труб, котлов, breeching, баков и воздуховодов. Владелец здания до начала работ обязан определить наличие, место и количество ACM/PACM и уведомить подрядчика. Не резать старую обмотку — остановиться и запросить обследование.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Классы асбестовых работ</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Class I — удаление TSI и surfacing ACM/PACM. Class II — удаление прочего ACM. Class III — ремонт и обслуживание, при которых ACM/PACM вероятно будет потревожен: мокрый метод, по возможности местная вытяжка, при сверлении или резке TSI — непроницаемые укрытия. Class IV — контакт без нарушения материала. Предел воздействия — 0.1 f/cc (8-hour TWA). Без обучения по 1529 бригада HVAC не выполняет Class I.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Code of Safe Practices и tailgate-собрания</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">На стройке нужен письменный Code of Safe Practices по видам работ фирмы. Его вывешивают на объекте или выдают каждому бригадиру. Бригадир проводит toolbox/tailgate собрание по безопасности не реже чем раз в 10 рабочих дней.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Жара на улице: питьевая вода</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Вода должна быть питьевой, свежей, прохладной, бесплатной и стоять как можно ближе к месту работы. Если воды из водопровода нет, в начале смены её должно хватать из расчёта 1 кварта на человека в час на всю смену. Начинать с меньшим запасом можно, если есть порядок пополнения.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Жара на улице: тень и отдых для охлаждения</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Выше 80°F тень должна быть постоянно, и в ней должны сидеть все отдыхающие, не касаясь друг друга. При 80°F и ниже тень дают по первой просьбе. Работник может в любой момент уйти на preventative cool-down rest. Пока он отдыхает, за ним наблюдают и спрашивают о симптомах. Возвращать на работу можно только когда симптомы прошли, и не раньше чем через 5 минут плюс время на дорогу до тени.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Жара 95°F и выше: high-heat procedures</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Construction входит в список отраслей, обязанных выполнять high-heat procedures. При 95°F и выше нужно: связь с бригадиром (голосом, визуально, по телефону при надёжном сигнале); наблюдение, при котором бригадир или назначенный человек смотрит не больше чем за 20 работниками, а с одиночкой поддерживает регулярную связь; назначенный человек, который вызывает скорую; напоминания пить воду; собрание перед сменой. Обязательный отдых 10 минут каждые 2 часа ((e)(6)) установлен только для сельского хозяйства.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Акклиматизация, волна жары, письменный план</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Heat wave — день с прогнозом не ниже 80°F и минимум на 10°F выше среднего максимума за предыдущие 5 дней. В такие дни за всеми работниками внимательно наблюдают. Новичка в жаре наблюдают первые 14 дней. Человека с признаками теплового удара нельзя оставлять одного и нельзя отправлять домой, не предложив первую помощь или скорую. Нужен письменный Heat Illness Prevention Plan на английском и на языке большинства работников, доступный на объекте; можно включить его в IIPP.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Hazard Communication: SDS и обучение</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нужна письменная программа HazCom. SDS на каждое опасное вещество (хладагенты, клеи, мастики, флюсы, растворители) доступны в каждой смене; электронный доступ подходит, если нет препятствий. Обучать при первом назначении и при каждой новой опасности. Переносную тару для немедленного использования тем, кто переливал, маркировать не обязательно.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Пыль стекловаты и респираторы</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">При добровольном ношении работодатель выдаёт работнику Appendix D. Если человек по желанию носит только пылевую маску (filtering facepiece), включать его в письменную программу не требуется. Если респиратор требуется: письменная программа, медосмотр до fit test, fit test до первого использования и не реже раза в год, ежегодное обучение.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Первая помощь на объекте</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">На стройке у каждой фирмы минимум одна аптечка в водонепроницаемом контейнере; её регулярно проверяют и пополняют, состав утверждает врач. Нужен обученный человек для первой помощи и письменный план экстренной медпомощи. Работникам объясняют, что делать при травме. Телефоны врача, больницы, скорой и пожарных вывешивают или дают работникам. Где есть едкие вещества — возможность промыть глаза и тело. Для работ вне стройки действует §3400: аптечка на каждой работе, обученный человек, если рядом нет клиники, связь с 911 и умение объяснить, куда ехать.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">безопасность</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Люди в кузове пикапа</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Возить людей в кузове пикапа или бортовой машины нельзя. Ехать там тоже нельзя. Исключение: человек пристёгнут системой ремней, которая отвечает федеральным стандартам FMVSS.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Доп. работы — только по письменному change order</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Доп. работа или изменение входит в договор, только если change order письменный и подписан сторонами ДО начала этой работы. В нём: объём, сумма (+/−), влияние на график платежей и дату завершения (7159(c)(5), (d)(13), (e)(3)). Нашли на объекте, что нужна новая линия, переделка ductwork или электрики, — сначала подписанный change order, потом работа.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Монтаж по листингу и инструкции, сервисный зазор, зазоры до горючих материалов</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Монтаж выполняется по условиям листинга, по инструкции производителя и по CMC. Инструкцию по монтажу и эксплуатации нужно прикрепить к агрегату. Зазоры до горючих материалов берутся из листинга или с шильдика. Остальное: Chapters 8–9, NFPA 211, Table 303.10.1. Вокруг агрегата оставляют место, чтобы его можно было снять и поменять фильтры, вентилятор, мотор, горелку, контроллеры и дымоход.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Печь в шкафу или нише (closet/alcove)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Печь в шкафу или нише должна быть listed для такой установки. Если печь не listed, объём помещения должен быть не меньше 12 объёмов печи (для котла 16). Если потолок выше 8 ft, объём считают по высоте 8 ft.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Чердак: люк и проход к агрегату</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Люк и проход делают больше самой крупной части агрегата, но не меньше 22 x 30 in. Если высота прохода меньше 6 ft, от люка до агрегата не больше 20 ft по осевой линии прохода. При высоте 6 ft и больше допускается до 50 ft. По всему проходу нужен сплошной настил шириной не меньше 24 in.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Чердак: рабочая площадка, свет и розетка</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Перед сервисной стороной нужна ровная площадка не меньше 30 x 30 in. Исключение: печь обслуживается прямо из люка, и её сервисная сторона не дальше 12 in от люка. Рядом с агрегатом ставят постоянную розетку 120 V и светильник. Выключатель светильника ставят у входа в проход.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Оборудование в жилом гараже</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нагревательные элементы, выключатели, горелки и устройства розжига располагают не ниже 18 in от пола. Агрегат защищают от удара машиной: барьером, подъёмом или размещением вне пути машины.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Отвод конденсата: куда, уклон, диаметр, материал, прочистка</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Конденсат отводят в одобренный прибор или место сброса. С канализацией соединяют только непрямо (indirect waste), через air gap или air break. Уклон не меньше 1/8 in на фут (1%). Труба не меньше выхода агрегата. Сливать конденсат на тротуар или улицу (over a public way) запрещено. По Table 310.3 для оборудования до 20 тонн минимальный диаметр 3/4 in. Трубы меньше 1-1/4 in можно делать из PVC, CPVC, PE, PP или меди. Нужен cleanout или такая конфигурация, при которой засор убирается без разрезания трубы. Насос конденсата ставят только с одобрения AHJ, с блокировкой агрегата при отказе.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Защита от перелива конденсата (вторичный дренаж)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если перелив конденсата может причинить ущерб, кроме основного дренажа нужна одна из четырёх защит: (1) датчик уровня, выключающий агрегат; (2) дополнительный поддон с отдельным дренажом; (3) второй дренаж выше основного выхода; (4) поддон с датчиком уровня. Дренаж дополнительного поддона или линии делают не меньше 3/4 in, и выводят туда, где его заметно. Изоляцию и детали над поддоном ставят выше его бортика.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Запрещённые места забора обратного воздуха</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Обратный воздух нельзя брать из closet, ванной, туалета, кухни, гаража, котельной или печной, а также из неотапливаемого чердака. Нельзя брать его и из помещения с топливным прибором. Исключения указаны в коде: direct vent, enclosed furnace, бытовая сушилка и др. Нельзя брать воздух из помещения меньше 25% объёма, обслуживаемого системой, если нет постоянного проёма. Нельзя забирать воздух ближе нормативных расстояний до дымоходов. Обратка одной квартиры не должна попадать в другую.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Гибкий воздуховод: опоры, провис, подключение</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Flex должен соответствовать UL 181, длину берут минимальную. Горизонтальные участки крепят не реже чем через 4 ft, вертикальные не реже чем через 6 ft. Провис не больше 1/2 in на фут пролёта. Опора шириной не меньше 1-1/2 in в месте касания. Радиус изгиба не меньше одного диаметра. Патрубок с буртиком, длиной не меньше 2 in, металлический хомут (worm-gear). Внутренний рукав заводят за буртик не меньше чем на 1 in. Внешний слой обматывают двумя оборотами ленты. Flex не должен проходить через огнестойкие конструкции. Ограничение длины 5 ft (603.4.1) на жильё не распространяется.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Герметизация швов воздуховодов и ссылка на тест утечек</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Швы делают практически герметичными (лента, мастика, уплотнение); все воздуховоды герметизируют по Seal Class A. На обжатом соединении круглой трубы нахлёст не меньше 1-1/2 in и не меньше трёх саморезов равномерно по кругу. Лента или мастика должна быть listed по UL 181A или UL 181B с маркировкой. Тест утечек выполняют по California Energy Code: 150.0(m)(11) для частных домов.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Воздуховоды в подполе (crawl space), зазор от земли, сейсмика</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Воздуховод в подполе не должен перекрывать доступ к его частям. Там, где под ним нужно пролезать, оставляют не меньше 18 in по вертикали. Воздуховоды, кроме пластиковых, держат не ближе 4 in от земли и защищают от повреждений. В сейсмических зонах воздуховоды раскрепляют от смещения.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Крыша: площадка на скате, доступ, освещение, нагрузка</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">На крыше с уклоном 4:12 и круче у сервисной стороны нужна ровная площадка не меньше 30 x 30 in. К оборудованию на крыше должен быть доступ. Здание выше 15 ft должно иметь внутренний доступ на крышу, например лестницу с люком не меньше 22 x 24 in, если AHJ не одобрит другое. Требования к постоянной лестнице перечислены в 304.3.1.2. У выхода на крышу нужен постоянный свет с выключателем внутри здания. Крыша должна выдерживать нагрузку от агрегата, иначе её усиливают.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Наружный блок на земле: основание (pad)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Компрессор или конденсаторный блок, стоящий на земле, ставят на бетон или другое одобренное основание. Основание должно выступать не меньше чем на 3 in над прилегающей землёй.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Крепление и сейсмика HVAC-оборудования (в отличие от водонагревателя)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Стационарные приборы надёжно крепят по инструкции производителя. Опоры должны держать вертикальные и горизонтальные нагрузки по строительному коду. Опоры холодильного оборудования проектируют по building code как для Occupancy Category H, из негорючих материалов. Исключения: оборудование на A1 можно ставить на опоры из материалов, допустимых для этого типа здания. Также допускаются виброизоляторы, рассчитанные на ветер и сейсмику. Отдельного требования стягивать печь или кондиционер ремнями в CMC не найдено. Ремни обязательны для водонагревателя.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Водонагреватель: сейсмические ремни и основание</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Водонагреватель крепят от смещения при землетрясении: ремни ставят в верхней трети и в нижней трети высоты. Нижний ремень не ближе 4 in к блоку управления. Если водонагреватель стоит на грунте, нужно ровное бетонное или одобренное основание не меньше 3 in над землёй. По закону штата все новые и сменные водонагреватели (стандартные, до 120 галлонов) должны быть закреплены. Продавец дома письменно подтверждает это покупателю.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Поддон под водонагревателем на чердаке или над жильём</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Под водонагреватель ставят водонепроницаемый коррозионно-стойкий поддон глубиной не меньше 1-1/2 in. Дренаж из поддона не меньше 3/4 in, в одобренное место, конец трубы должен быть хорошо виден. Сбрасывать предохранительный клапан (T&amp;P) в поддон запрещено.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Доступ к компрессору и вентилям, освещение (и пробел по A2L)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">К компрессору, обязательным вентилям и частям для регулярного обслуживания нужен проход шириной не меньше 36 in и высотой не меньше 80 in. Исключения: к фильтрам и моторам вентилятора достаточно пространства 30x30x30 in; оборудование на A1 на чердаке требует проход 22x30 in; оборудование на A1 или B1 на крыше или наружной стене получает доступ как печи по 304.3. Для оборудования, которому нужен доступ, ставят постоянное освещение с выключателем у входа; на крыше и на наружной стене это не требуется. В исключениях A2L не упомянут, поэтому для A2L-оборудования на чердаке нужно уточнить позицию AHJ.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Больше 25 футов новых воздуховодов: изоляция R-6/R-8 и тест</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если поставили больше 25 футов новых или заменённых воздуховодов, новые воздуховоды в неотапливаемом пространстве изолируют до R-6 (CZ 3, 5–7) или R-8 (CZ 1, 2, 4, 8–16), Table 150.2-D. Вся изменённая система проходит тест. Полностью новая система воздуховодов (не меньше 75% нового материала): утечка ≤5% от airflow AH. Удлинение старой системы: ≤10% общая, или ≤7% наружу, или заделка утечек + smoke test ECC-Rater.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Полностью новая система (entirely new or complete replacement): требования как для нового дома</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Полностью новая система = всё оборудование (сплит: condensing unit, coil и AH; или весь packaged) плюс новая система воздуховодов. Она должна выполнять §150.0(h), 150.0(i), 150.0(j)1–2, 150.0(m)1–10, (m)12, (m)13, 150.1(c)7, 150.2(b)1Fii, 150.2(b)1G и Table 150.2-A. Это расчёт нагрузки, фильтры, airflow, fan efficacy и проверка заряда.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Работа с холодильным контуром → замена всех термостатов на setback</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если в AC или HP поставили или заменили компрессор, конденсатор, испаритель, metering device или трубы, все термостаты системы меняют на setback thermostat по §110.2(c). Он должен позволять задать температуру минимум на 4 периода за 24 часа. Термостаты для HP отвечают также §110.2(b).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Нагрев: электрический ТЭН не может быть основным источником</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">При переделке или замене отопления нельзя ставить electric resistance как основной источник тепла. Исключения: (1) non-ducted ТЭН, если старое отопление тоже на ТЭНах; (2) ducted ТЭН, если старое на ТЭНах и ducted охлаждение не меняют и не ставят; (3) в CZ 7 или 15 ТЭН допустим, если старое отопление на ТЭНах.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Наружный блок не ближе 5 футов от dryer vent; liquid line drier</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Наружный блок AC или HP ставят не ближе 5 футов (1.5 м) от выхода вентиляции сушилки. Liquid line filter drier ставят, если его требует инструкция производителя. По §150.2(b)1 новое оборудование при переделке выполняет §150.0(a)–(l), поэтому правило касается и change-out.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Расчёт нагрузки (Manual J) и подбор (Manual S-2023)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нагрузку считают по ASHRAE Handbook, SMACNA или ACCA Manual J. Внутренние расчётные температуры: 68°F для отопления и 75°F для охлаждения. Наружные: не ниже 99.0% heating dry bulb и не выше 1.0% cooling dry bulb (JA2, ASHRAE или Manual J). Подбор по ACCA Manual S-2023: для охлаждения нижнего предела мощности нет; печи по Manual S-2023 Table N2.5. Для полностью новых систем действует Table 150.2-A (максимальная мощность).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Фильтры MERV 13 для полностью новой системы</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если система подаёт воздух через воздуховоды длиннее 10 футов (3 м), фильтр должен быть MERV 13 или лучше (ASHRAE 52.2), либо по AHRI 680: ≥50% частиц 0.30–1.0 µm и ≥85% частиц 1.0–3.0 µm. Также действует ограничение на перепад давления чистого фильтра (150.0(m)12D). Испарительные охладители исключены.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">CALGreen: не для простого change-out; закрывать открытые воздуховоды</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Для пристроек и переделок CALGreen действует, только если работа увеличивает отапливаемую площадь, объём или размер здания, и только в зоне работ. Простой change-out без расширения под CALGreen не попадает. На новых объектах (и в зоне расширения) открытые концы воздуховодов и воздухозаборов закрывают лентой, плёнкой или жестью при черновом монтаже, при хранении на объекте и до пуска.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Отвод конденсата</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Конденсат собирают и отводят в одобренный сантехнический прибор или место сброса, в канализацию — только через indirect waste pipe. Уклон — не меньше 1/8 inch per foot (1%). Материал коррозионностойкий, диаметр не меньше выхода. «Condensate or wastewater shall not drain over a public way» — нельзя сливать на тротуар или улицу.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Защита от перелива конденсата</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если перелив может что-то повредить, кроме основного дренажа нужен один из вариантов: (1) датчик уровня, отключающий оборудование; (2) дополнительный поддон с отдельным дренажом; (3) дополнительный дренаж выше основного выхода поддона; (4) дополнительный поддон с датчиком отключения. Дренаж дополнительного поддона или выхода — не меньше 3/4 inch и выводится туда, где его легко заметить.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Точка сброса конденсата, ревизия, насос</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Конденсат подключают в канализацию косвенно: через air gap или air break к trapped and vented receptors, dry wells, mop sinks, leach pits или tailpiece сантехприборов. Подключение к tailpiece раковины или переливу ванны — только в помещении, которое контролирует тот же человек. Дренаж должен прочищаться без разрезания трубы (cleanout). Насос ставится с одобрения AHJ и сблокирован с оборудованием, чтобы при отказе оно не работало.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">AIM Act: установка сплитов и HP с GWP 700 и выше</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">С 01.01.2025 запрещено устанавливать новые residential и light commercial AC/HP системы с GWP 700 и выше (кроме VRF). Но систему можно ставить, если все specified components изготовлены или ввезены до 01.01.2025. Прежний предельный срок такой установки (до 01.01.2026) убран правилом 91 FR 31284, вступившим в силу 27.07.2026. В Калифорнии дополнительно действует запрет CARB.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">AIM Act: VRF с GWP 700 и выше</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">С 01.01.2026 нельзя ставить новые VRF с GWP 700 и выше. Исключения: если все specified components изготовлены до 01.01.2026 — можно ставить до 01.01.2027. Если building permit выдан до 05.10.2023 и в нем указан этот хладагент — до 01.01.2028.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">CARB: запрет на GWP 750 и выше в новом AC</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В CA запрещено продавать, сдавать в аренду, устанавливать и использовать новое AC-оборудование, изготовленное после даты вступления запрета, на хладагенте с GWP 750 и выше. Other air-conditioning (new), residential and non-residential — с 01.01.2025. VRF — с 01.01.2026. Room, wall, window, PTAC, PTHP, portable — с 01.01.2023. Регламент распространяется на тех, кто устанавливает. Перед установкой сверьте дату выпуска на шильдике каждого блока. Исключение по building permit ((c)(2)(D)) в тексте сформулировано для new refrigeration equipment; распространяется ли оно на AC, не подтверждено.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Жара в помещении и на чердаке (indoor heat)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Правило действует в indoor-зонах, где 82°F и выше. Indoor — это место под потолком или покрытием, огороженное по периметру. Слово attic в тексте не встречается, но чердак под определение, по-видимому, подходит (не подтверждено Cal/OSHA). Исключение: короткий заход при 82–95°F меньше 15 минут в любой час; оно не работает для машин без исправного кондиционера. Оценка и контроль обязательны при одном из условий: температура или heat index 87°F и выше; 82°F и выше при одежде, мешающей отводу тепла; 82°F и выше при сильном тепловом излучении. Что делать: измерить температуру и heat index и записать большее значение с датой, временем и местом; повторить замер, когда ожидается рост на 10°F и больше. Нужны cool-down area и вода; отдых не меньше 5 минут.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Лестницы: установка</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Приставную или выдвижную лестницу ставят с наклоном 1:4 (по горизонтали четверть рабочей длины) и закрепляют или держат от сползания. Если по ней выходят на крышу, борта выступают над краем не меньше 36 дюймов; если так нельзя, верх крепят к жёсткой опоре и ставят поручень. Выдвижная: верхняя секция лежит на нижней, замки ступеней защёлкнуты. Не ставить в проходах, дверях и на проездах без ограждения.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Лестницы: работа, осмотр, обучение</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Подниматься и спускаться лицом к лестнице с тремя точками опоры. Не стоять на трёх верхних ступенях приставной или выдвижной лестницы без надёжной опоры для руки или страховки. На стремянке не стоять на полке, на верхней площадке (top cap) и на ступени под ней. Около открытых токоведущих частей — только непроводящая лестница; проводящая должна иметь надпись CAUTION – Do Not Use Around Electrical Equipment. Лестницы часто осматривает qualified person; повреждённую убирают и помечают Dangerous, Do Not Use. До первой работы на лестнице работника обучают.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Защита от падения на стройке</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Страховка (fall arrest, restraint или positioning) обязательна, если можно упасть с высоты больше 7½ футов: с края здания, открытого борта, через проём, со скатной крыши круче 7:12 или другой поверхности круче 40°, когда нет иной защиты. Анкер — не меньше 5000 фунтов на человека, либо система с запасом прочности 2 под надзором qualified person. С 1998 года поясной ремень в системе остановки падения запрещён. §1730 (порог 20 футов) относится к кровельным работам и не заменяет §1670 при монтаже HVAC на крыше.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Проёмы в крыше под curb или новый блок</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Проёмы в крыше и световые фонари закрывают временными перилами с бортиком или крышкой. Крышка держит не меньше 400 фунтов или двойную нагрузку на 1 кв. фут (берётся большее), закреплена от сдвига и подписана Opening--Do Not Remove буквами не меньше 1 дюйма; мелом не писать.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Пайка и горячие работы: пожарная безопасность</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если ведутся работы из §4794(a)/§4850(a), фирма обязана иметь процедуру пожарной безопасности по ANSI Z49.1-94 и NFPA 51B-2009 и выдать по ней инструкции. Огнезащитные одеяла и экраны должны быть одобрены по §3206. Что именно охватывают §4794(a) и §4850(a), не проверено.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Шум наружного блока на границе участка</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Средний уровень шума за час на границе участка и дальше не выше: для дома на одну семью 50 dB с 7 до 19, 45 dB с 19 до 22, 40 dB с 22 до 7; для многоквартирных домов 55, 50 и 45 dB; для коммерческих участков 65 dB днём и 60 dB с 19 до 7. На границе двух зон берут среднее двух пределов. Поэтому место для конденсатора у забора соседа надо выбирать с учётом этих цифр.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Тяжёлое или крышное оборудование: building permit и расчёт</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Building permit и чертежи нужны, если для опоры и крепления надо переделывать конструкцию пола, крыши или платформы. Также если оборудование стоит на новой площадке на грунте вне контура здания или «has an operating weight in excess of 2,500 lb». Структурный расчёт нужен, если «Equipment weight exceeds 400 pounds» или центр тяжести выше «four feet above the supporting base».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Конденсатор в боковом или заднем дворе: 4 фута от границы участка</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В жилых зонах mechanical equipment (в том числе кондиционеры) может стоять в обязательных side/rear yards, но «At-grade equipment shall be located a minimum of 4 feet from the property line». Отступ не нужен, если есть шумопоглощение и доказано соответствие пределам шума по §59.5.0401. IB 103 прямо ссылается на это правило.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">монтаж</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Чек-лист County по конденсатору (что проверяют)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Что проверяют по конденсатору: заземление по коду; предохранители по шильдику; liquid tight conduit закреплён; «Line set 3/4” wall insulation, UV-resistant exterior or protected»; disconnect и цепь по шильдику; ровная и надёжная площадка; «Code required working clearances (30” x 36”d) for electrical disconnect»; проходы в здание загерметизированы; CF1R/CF2R/CF3R зарегистрированы; «Exterior refrigerant service ports fitted with tamper-resistant locking cap».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">EPA 608: кому нужен сертификат и какого типа</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Каждый, кто может вскрыть холодильный контур при обслуживании, ремонте или утилизации оборудования с хладагентом class I/II или non-exempt substitute, должен сдать экзамен EPA 608. Type I — малые приборы. Type II — medium-, high- и very high-pressure оборудование (кроме малых приборов и MVAC). Type III — low-pressure. Universal — все типы. Лицензия C-20 этот сертификат не заменяет.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">EPA 608: ученики, копия сертификата</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Apprentice может работать без сертификата, только если его близко и постоянно контролирует сертифицированный техник; отвечают оба. Копию сертификата храните на месте работы бизнеса. Держите её ещё 3 года после того, как перестали работать техником.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Покупка хладагента и запрет выпуска</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Хладагент (class I/II или non-exempt substitute) продают только сертифицированному технику или работодателю, у которого есть такой техник и который показал доказательство. Сознательно выпускать хладагент в атмосферу при обслуживании, ремонте или утилизации запрещено. Исключения перечислены в правиле: CO2, азот, вода и ряд других.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">A2L (R-454B, R-32): допуск, листинг, маркировка, датчики утечки</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В жилых комфорт-системах high-probability запрещены A2, A3, B1, B2L, B2, B3. A2L разрешён по 1104.6. Система должна быть listed и смонтирована строго по листингу, инструкции и маркировке. На шильдике ставится символ горючего хладагента, у сервисных портов наклейка о горючем хладагенте. Ограничения по заряду определяет листинг и ASHRAE 15. Детектор утечки выполняется по листингу и ASHRAE 15. При срабатывании включается вентилятор, отключаются компрессор и электроприборы, кроме управления и вентилятора, полностью открываются заслонки. Вентилятор работает не меньше 5 минут после снижения концентрации.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">A2L: источники воспламенения в воздуховодах</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В воздуховоды, которые обслуживают помещение с системой на A2L, нельзя постоянно ставить устройства с открытым пламенем и неклассифицированные (unclassified) электрические устройства. Поверхности горячее 1290°F (700°C) допускаются только при потоке не меньше 200 ft/min и с подтверждением потока до включения нагрева.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Смена хладагента в существующей системе (ретрофит, drop-in)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Перевести систему на хладагент с другим обозначением можно при трёх условиях. (1) Есть согласие владельца. (2) Есть письменная инструкция производителя, или оценка инженера либо NRTL, или одобрение AHJ. (3) Если меняется группа безопасности (например, A1 на A2L), система должна соответствовать требованиям как новая установка, и нужно одобрение AHJ. Смешивать разные хладагенты можно только в случаях из 1104.8.4. Восстановленный (recovered) хладагент можно возвращать только в ту систему, из которой он извлечён, кроме случаев, указанных в 1104.8.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Колпачки с замком на наружных сервисных портах</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Наружные сервисные порты кондиционера защищают от посторонних колпачками с замком (locking-type tamper-resistant) или иным способом, одобренным AHJ. Исключение: порты в закрытой зоне за стеной или забором с доступом по ключу.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Заряд хладагента: монтажник заряжает, ECC-Rater проверяет</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Монтажник заряжает систему по инструкции производителя. Проверка: (I) standard charge verification RA3.2.2 (делают монтажник и rater) или (II) монтажник делает weigh-in RA3.2.3.1, а ECC-Rater проверяет по RA3.2.2 и RA3.3. Если на улице ниже 55°F и использован weigh-in, можно применить проверку RA3.2.3.2. Тогда термостат по §110.12, ducted система всё равно проходит проверку airflow.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Системы без стандартной проверки и packaged с заводской заправкой</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если систему нельзя проверить по 150.2(b)1Fiib, монтажник делает weigh-in (RA3.2.3.1), а ECC-Rater проверяет по RA3.2.3.2. Ducted системы ещё проходят проверку airflow. Полностью новый packaged блок с заводской заправкой в поле не проверяют, но монтажник подтверждает на Certificate of Installation, что блок заправлен на заводе и не изменён. Airflow для ducted всё равно проверяют.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Какой сертификат EPA 608 нужен</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Каждый, кто может вскрыть контур при обслуживании, ремонте или утилизации системы с хладагентом class I/II или non-exempt substitute, должен сдать экзамен EPA 608. Small appliances — Type I. Medium-, high- и very high-pressure appliances (сплиты, руфтопы) — Type II. Low-pressure — Type III. Все три — Universal. Apprentice без сертификата работает только под «closely and continually» надзором сертифицированного техника. Копию сертификата держать в офисе компании и хранить 3 года после ухода техника из профессии.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Запрет на сброс хладагента (venting)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Запрещено сознательно выпускать хладагент при обслуживании, ремонте или утилизации. Допустимы только мелкие (de minimis) потери при добросовестной откачке, если соблюдены §§ 82.155–82.156 и техник и машина откачки сертифицированы. Выпустить уже откачанный хладагент — тоже нарушение. Исключения перечислены поштучно (CO2, азот, вода, R-290 в self-contained room AC и др.). R-32 и R-454B в этом списке не значатся.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3
