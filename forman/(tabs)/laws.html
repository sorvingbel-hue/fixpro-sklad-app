p1 r-mm8iar r-adyw6z r-b88u0q">Уровень откачки перед вскрытием или утилизацией</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Перед вскрытием или утилизацией откачайте сертифицированной машиной весь хладагент, включая жидкую фазу, до уровня из Table 1, и проверьте, что уровень достигнут. High-pressure appliance с зарядом меньше 200 lbs — 0 inches Hg vacuum (для машин любого года). Мелкий ремонт без последующего вакуумирования (не major) — не выше 0 psig. Если система течет — отсечь течную часть, целые узлы откачать по Table 1, течные — до минимально достижимого уровня, но не выше 0 psig.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Куда девать откачанный хладагент</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Без переработки откачанный хладагент можно вернуть только в ту же систему или в другую систему того же владельца. Продавать или передавать б/у хладагент можно только после reclaim у сертифицированного reclaimer. Не заправлять им систему другого клиента.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Покупка хладагента только с сертификатом</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Хладагент продают только сертифицированному технику (Type I/II/III/Universal) или компании, у которой есть сертифицированный техник и которая предъявила доказательство этого. Продавец хранит накладные и документы покупателя 3 года. Держите копию карточки 608 для supply house.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Leak repair: когда обязателен</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Федеральный leak repair для ODS (например R-22) применяется только к системам с полным зарядом 50 lbs и больше. На системы только с substitute (например R-410A) он не распространяется. HFC leak repair по 40 CFR 84 действует с 01.01.2026 для систем с зарядом 15 lbs и больше (HFC или substitute с GWP больше 53). Но для подсектора residential and light commercial AC and heat pumps он прямо не применяется. Для холодильного оборудования с зарядом от 15 lbs применяется: после добавления или удаления хладагента выдать владельцу документ по (l)(2).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">A2L (R-32, R-454B и др.): обязательные условия EPA SNAP</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Эти хладагенты разрешены только в новом оборудовании, спроектированном под них; заправлять ими старую систему (retrofit) нельзя. Оборудование соответствует UL 60335-2-40 3rd edition, заправка не превышает максимум для площади помещения. Предупреждающие надписи постоянные, буквы не меньше ¼ дюйма; на внутреннем блоке указаны минимальная площадь помещения и, если нужно, минимальная высота установки. Сервисные порты и места вскрытия контура окрашены в красный PMS #185 / RAL 3020 не меньше чем на 1 дюйм в каждую сторону; если метку сняли, её восстанавливают.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">хладагент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">A2L: рекомендации EPA и запрет на выпуск в атмосферу</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">EPA рекомендует (should): очки и перчатки; рядом огнетушитель класса B (сухой порошок); искробезопасный инструмент; станцию рекуперации для горючих хладагентов; работу только обученными техниками по Annex HH UL 60335-2-40. Если концентрация выше ¼ LFL, помещение покидают и проветривают. Обязательно по закону: CAA §608(c)(2) запрещает сознательно выпускать хладагенты-заменители; соблюдать требования DOT к перевозке горючих газов. Извлечённый горючий хладагент, скорее всего, является опасными отходами по RCRA.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Электрика: граница C-20 и C-10 (incidental and supplemental)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Работа C-10 — любая проводка и подключение того, что использует электроэнергию. C-20 может делать работу другой специальности, только если она incidental and supplemental, то есть &#x27;essential to accomplish&#x27; работу C-20. Такую работу можно отдать субподрядчику или сделать своими работниками. Panel upgrade CSLB относит к C-10. Точной письменной границы для disconnect, whip или новой линии от щита у CSLB нет — спорные случаи уточнять письмом на classifications@cslb.ca.gov.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Сертификат электрика нужен только работникам C-10</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Государственная сертификация электрика (Labor Code §108) обязательна только для тех, кто работает электриком у подрядчика C-10.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Разъединитель и сервисная розетка у оборудования</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">У оборудования свыше 50 V нужен разъединитель рядом с ним и в пределах видимости. Другой вариант допускается, только если он соответствует California Electrical Code. Сервисную розетку 120 V ставят не дальше 25 ft от оборудования и на стороне питания (supply side) разъединителя. На одном уровне с агрегатом она быть не обязана.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">HP с доп. нагревом: блокировка выше 35°F, термостат, мощность ТЭНа</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Доп. нагрев (ТЭН или газовая печь) блокируется выше 35°F наружной температуры, кроме defrost и аварийного режима. Термостат получает наружную температуру (датчик или интернет-погода), показывает её и имеет индикатор доп. или аварийного нагрева. Монтажник подтверждает тест на CF2R. Мощность ТЭНа ≤ номинальная мощность охлаждения HP (при 95°F) × 2.7 кВт на тонну, с округлением вверх до кВт. В CZ 7 и 15 (и домах &lt;500 sq ft) вместо блокировки при 35°F допускается Option A или B.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Disconnect в пределах видимости и легко доступен</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Disconnect должен стоять «within sight from, and readily accessible from» агрегата AC/холодильного оборудования. Его можно ставить на агрегат или внутри него. Перед disconnect нужно рабочее пространство по 110.26(A).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Disconnect не на съёмной панели и не поверх шильдика</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Disconnect нельзя ставить на панели, которые снимают для доступа к оборудованию, и там, где он закрывает шильдик. Exception No. 2: если disconnect — вилка и розетка (по 440.13), достаточно «accessible», «readily accessible» не обязательно. Exception No. 1 — только для промышленных процессов. Жилищного исключения про high-mount (Exception No. 3, обсуждалось для NEC 2026) в NEC 2023 нет, не опираться на него.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Сервисная розетка у HVAC-оборудования (не проверено)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В задании указан 210.63: розетка 125 В для обслуживания HVAC-оборудования. Условия НЕ ПРОВЕРЕНЫ: расстояние, уровень, исключения, GFCI. Прочитать в CEC 2025 до внесения в приложение.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">GFCI для наружного HVAC в жилых домах (не проверено)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В задании указан 210.8 (наружные outlets жилых домов). НЕ ПРОВЕРЕНО, требует ли CEC 2025 GFCI на питание наружного агрегата и есть ли калифорнийская поправка. В официальных страницах errata видели только отсылку из 422.5: «Section 210.8 specifies requirements for GFCI protection for the branch-circuit outlet».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Провод и автомат по шильдику (MCA/MOCP)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Сечение провода и номинал защиты для AC/HP берутся по данным шильдика. Видели только перекрёстную отсылку: hermetic compressors защищаются «in accordance with Part VI of Article 440», минимальная маркировка — «430.7 and 440.4». Сами разделы Article 440 о подборе провода и автомата НЕ ПРОВЕРЕНЫ.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Газовая печь на отдельной линии</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Central heating equipment (кроме fixed electric space-heating) питается от individual branch circuit. Исключение 1: вспомогательное оборудование печи (насос, клапан, увлажнитель, электронный фильтр) можно на ту же линию. Исключение 2: «Permanently connected air-conditioning equipment shall be permitted to be connected to the same branch circuit».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Чердак или подпол: розетка, свет, проход</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Рядом с appliance на чердаке или под полом нужны постоянная розетка 120 V и светильник. Выключатель ставится у входа в проход. Проход: сплошной настил не уже 24 inches (304.4.2). Перед сервисной стороной — площадка не меньше 30 x 30 inches (304.4.3).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Lockout: отключение и блокировка энергии</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">При ремонте и наладке оборудование запирают замком или пломбируют в положении off. Если замок поставить нельзя, его отключают от питания. У фирмы должна быть письменная процедура контроля опасной энергии: установка, снятие и передача замков и бирок, проверка отключения. Исключение: прибор на шнуре с вилкой, если вилка под личным контролем того, кто работает. Есть и групповая блокировка: каждый вешает личный замок; букву этого подраздела я не сверял.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">электрика</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Electrical permit при изменении проводки HVAC (город)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Electrical permit нужен на любую установку или замену проводки, устройств и оборудования (§129.0302). Без permit можно только мелочь: заменить предохранитель, выключатель, автомат или розетку того же размера и типа (§129.0303(a)), работать с цепями до 25 В / 50 Вт (§129.0303(c)). Permit выдают только при лицензии CSLB, «that permits electrical installation», или владельцу/арендатору (§129.0306).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Bonding CSST</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Газовая система с CSST, даже с одним участком, должна быть электрически непрерывной и забонжена к grounding electrode system сервиса. Перемычка — не тоньше 6 AWG медь, длина — не более 75 feet. Крепится к металлической трубе, фитингу или фитингу CSST. Соединения — по CEC. Другие трубы считаются забонженными, если прибор заземлён через equipment grounding conductor.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Проверка пропускной способности газовой трубы</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">При добавлении приборов существующую трубу проверяют на достаточную пропускную способность. Если мало — увеличивают или тянут отдельную линию. Расход берут не меньше максимального часового input производителя. Размер трубы определяют по таблицам или формулам Chapter 12 (Table 1215.2(1) и далее для природного газа), по таблицам производителя листингованной системы или инженерным методом.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Отвод под прибор не меньше 1/2 inch</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Диаметр отвода газовой трубы к прибору — не меньше 1/2 inch (15 mm).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Кран перед прибором (appliance shutoff valve)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">У каждого прибора — доступный одобренный ручной кран с nondisplaceable valve member (или листингованный gas convenience outlet), один кран на один прибор. Кран не дальше 6 feet от прибора. Если есть connector, кран стоит upstream от него. Downstream от крана нужен union или фланец, чтобы снять контролы.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Краны 1 inch и меньше — listed and labeled</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Газовые краны выбираются по Table 1208.13. Краны размером 1 inch NPT и меньше должны быть listed and labeled. Снаружи — по рекомендации производителя.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Sediment trap</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если грязевик не встроен в прибор, его ставят после крана (downstream), как можно ближе ко входу прибора. Это тройник с заглушённым ниппелем внизу (Figure 1212.9) или другое признанное устройство. Не требуется для освещения, плит, сушилок, декоративных приборов и газовых каминов, наружных кухонных приборов. Для печей и котлов исключения нет.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Какие газовые коннекторы можно</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Прибор подключают одним из способов: жёсткой металлической трубой; полужёсткой металлической трубкой (алюминиевую нельзя снаружи); коннектором по ANSI Z21.24 (в той же комнате, один на прибор); снаружи — коннектором по ANSI Z21.75 (один на прибор); CSST по инструкции. CSST нельзя заводить прямо в металлический корпус прибора с металлическим дымоходом выше крыши, CSST — только к стационарным приборам. Коннекторы защищают от механических и тепловых повреждений.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Резьба и б/у материалы</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Б/у трубы и фитинги нельзя ставить, если они не очищены и не проверены на пригодность. Трубы с сорванной, сколотой или ржавой резьбой не использовать. Резьбовые соединения делать с thread joint sealing material.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">газ и дымоудаление</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Газовая разводка: только к своему оборудованию</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">HVAC-подрядчик может брать permit на удлинение газовой линии только к оборудованию, которое сам ставит в рамках своей классификации CSLB. Перекладку газовой системы и газ к оборудованию, которое ставили другие, ему брать нельзя.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Change-out (AH, наружный блок, змеевик) → тест герметичности воздуховодов</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В любой зоне при установке или замене AH, наружного блока сплита (AC/HP) или змеевика в single-family доме подключённые воздуховоды герметизируют и проверяют тестом RA3.1. Нужно одно из трёх: общая утечка ≤10% от airflow AH; утечка наружу ≤7%; если не выходит, заделать все доступные утечки, а ECC-Rater проверяет визуально и smoke test. Исключения: система уже загерметизирована и это подтверждено тестом; воздуховодов меньше 40 линейных футов; асбест.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Воздуховоды или оборудование в гараже</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если новые или заменённые воздуховоды, AH, змеевик или plenum стоят в гараже, длина воздуховодов значения не имеет. Нужно одно из двух: утечка системы ≤6% от airflow AH (RA3.1.4.3.1) или все доступные утечки в гараже заделаны и подтверждены визуально + smoke test ECC-Rater (RA3.1.4.3.5).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Airflow после работы с контуром: HP в любой зоне, AC в CZ 2 и 8–15</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Для air-cooled AC в CZ 2 и 8–15 и для air-source HP во всех зонах (ducted split, packaged, SDHV, mini-split): airflow ≥300 cfm на тонну (SDHV ≥250 cfm/ton), подтверждается тестом RA3.3. Если не выходит: процедура RA3.3.3.1.5, и термостат по §110.12. В CZ 7 (прибрежный San Diego) замена только AC под это правило не попадает, HP попадает.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Heat pump: таймер defrost ≥90 минут</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если у HP есть регулируемый монтажником defrost delay timer, его выставляют на ≥90 минут. Монтажник подтверждает на Certificate of Installation (CF2R), что настройка проверена по процедуре CF2R. Исключения: дома в CZ 6 и 7; дома ≤500 sq ft в CZ 3, 5–10 и 15.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Полностью новая система: зонд статического давления, 350 cfm/ton, W/cfm</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В supply plenum после испарителя делают отверстие под статический зонд (HSPP) или ставят постоянный зонд (PSPP) по RA3.3.1.1. Одно-зонная система: ≥350 cfm/ton в каждом режиме и fan efficacy ≤0.45 W/cfm (AH газовой печи) или ≤0.58 W/cfm (прочие AH). SDHV: ≥250 cfm/ton и ≤0.62 W/cfm. Проверка по RA3.3. Системы без зональных заслонок могут вместо этого соблюсти Table 150.0-B/C.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Лёгкая коммерция: замена оборудования → DR-термостат и тест воздуховодов</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">При замене AH, наружного блока или змеевика термостат, не отвечающий §110.12, меняют на demand responsive thermostat. Воздуховоды герметизируют до ≤15% номинального airflow AH (acceptance test NA7.5.3), если выполнены все условия: не медучреждение, constant volume single zone, обслуживает &lt;5,000 sq ft, &gt;25% площади воздуховодов снаружи или в неотапливаемом пространстве. Если не выходит: заделка + smoke test сертифицированным mechanical acceptance test technician. Прочие новые воздуховоды тестируют по CMC 603.9.2.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Опрессовка газовой трубы</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Испытание воздухом, CO2 или азотом, кислородом нельзя. Обычно: не менее 10 psi не меньше 15 минут без заметного падения. Для сварных труб и давления выше 14 inches water column: не менее 60 psi не меньше 30 минут. Для CSST при давлении выше 14 in. w.c.: не менее 30 psi 30 минут. Испытание в присутствии AHJ, оборудование для него даёт держатель permit.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Замена прибора: что опрессовывать</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">После ремонта или добавлений опрессовывают затронутый участок. Мелкий ремонт можно не опрессовывать, если работу осмотрели и соединения проверили некоррозийной жидкостью для поиска утечек. Новую ветку к новому прибору опрессовывают только её, стык с существующей трубой проверяют жидкостью.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Пуск газа и запуск прибора</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">При пуске газа в новую систему проверить, что нет открытых концов, а краны на неиспользуемых выходах закрыты и заглушены. Сразу после пуска газа проверить систему на утечки. Прибор запускать только после проверки на утечки, продувки (purge) по 1213.6 и проверки соединений прибора.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Подключение к газу и питанию только после финала; тесты на подрядчике</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Оборудование не подключают к газу, воде или питанию до финального одобрения, «except when otherwise approved by the Building Official for construction or test purposes». Инспекцию назначает держатель permit. До вызова инспектора он сам убеждается, что тест будет пройден, и даёт оборудование, материалы и людей для теста.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">тесты и пуск</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">ECC (бывший HERS) до закрытия permit</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Город: HERS-оценка нужна «to obtain final inspection approval», в том числе при «Major HVAC system changes or replacements». По сноске 2 таблицы 1B: «Replacement of these systems requires a HERS rating when more than 40 feet of duct is in unconditioned space» (это формулировка города; текст Energy Code §150.2(b) — раздел не проверен). Штат (CEC): «The ECC Program becomes effective with the 2025 Energy Code… It replaces the HERS Program.» Для срочных переделок, например HVAC changeout, сертификаты можно зарегистрировать позже, «but before the permit is closed or finalized».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Когда нужен письменный Home Improvement Contract</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Договор с владельцем или жильцом на home improvement при общей цене больше $500 — это home improvement contract (7159(b)). Он и все изменения письменные и подписаны сторонами ДО начала работ (7159(d)). До начала работ клиенту дают копию, подписанную и датированную обеими сторонами. С её получения идёт срок отказа (7159(c)(3)(A)). Шрифт от 10 pt, заголовки от 10 pt bold (7159(c)(2)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Обязательные пункты договора и первая страница</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">На первой странице: дата подписи покупателем; имя, адрес и email подрядчика для Notice of Cancellation с фразой, что notice можно туда отправить; телефон для помощи с notice (7159(c)(3)(B)). В договоре: имя, адрес, номер лицензии; заголовок &#x27;Home Improvement&#x27;; &#x27;Contract Price&#x27;; &#x27;Finance Charge&#x27; отдельно; описание проекта и значимых материалов и оборудования; &#x27;Approximate Start Date&#x27; / &#x27;Approximate Completion Date&#x27;; &#x27;Note About Extra Work and Change Orders&#x27; (7159(d)). Галочка Yes/No о субподрядчиках; при Yes — дословный disclaimer, и он же на каждом change order (7159(c)(7)). Notice о праве потребовать performance and payment bond рядом с подписями (7159(c)(6)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Аванс: максимум $1,000 или 10%, что меньше</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Down payment не больше $1,000 или 10% суммы контракта — берётся меньшее (7159.5(a)(3)). В договоре 12 pt bold дословно: &#x27;THE DOWNPAYMENT MAY NOT EXCEED $1,000 OR 10 PERCENT OF THE CONTRACT PRICE, WHICHEVER IS LESS.&#x27; (7159(d)(8)(C)). Пример: контракт $8,000 → аванс максимум $800. Исключение: performance and payment bond, lien and completion bond или joint control, одобренные регистратором (7159.5(a)(8)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Нельзя брать оплату вперёд за невыполненную работу</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Кроме аванса, нельзя просить или брать оплату больше стоимости выполненной работы и доставленных материалов. Это касается и денег от кредитора или финансовой компании (7159.5(a)(5)). Платежи — по &#x27;Schedule of Progress Payments&#x27;, каждый в долларах и центах и привязан к этапу. Обязательная фраза 12 pt bold: &#x27;IT IS AGAINST THE LAW FOR A CONTRACTOR TO COLLECT PAYMENT FOR WORK NOT YET COMPLETED, OR FOR MATERIALS NOT YET DELIVERED...&#x27; (7159(d)(9)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Обязательные notices: Mechanics Lien Warning, CGL, Workers&#x27; Comp, CSLB</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В договор включают дословный &#x27;MECHANICS LIEN WARNING&#x27; (7159(e)(4)). Notice &#x27;Commercial General Liability Insurance (CGL)&#x27; — одна правдивая фраза: нет / есть у страховщика X с телефоном / self-insured / LLC (7159(e)(1)). Notice &#x27;Workers&#x27; Compensation Insurance&#x27; (7159(e)(2)); для C-20 верна только фраза &#x27;carries workers&#x27; compensation insurance for all employees&#x27;. Notice о CSLB 12 pt с телефоном 800-321-CSLB (2752) (7159(e)(5)). Mechanics Lien Warning можно не включать при bond или joint control (7159.5(a)(8)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Lien release после каждой оплаты</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">После оплаты части работ и до следующего платежа подрядчик даёт full and unconditional release по Civil Code 8400 и 8404 на оплаченную часть. По 7159(c)(4) это условие пишется в договор; по 7159.5(a)(6) release даётся по запросу клиента. Пока release нет, клиент вправе удерживать дальнейшие платежи.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Service and Repair Contract до $750</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Короткий договор &#x27;Service and Repair&#x27; допустим, только если выполнены ВСЕ 4 условия: сумма $750 или меньше; клиент сам обратился за работой; не продаётся ничего сверх нужного для этой проблемы; никакой оплаты до завершения (7159.10(a)(1)). &#x27;Завершена&#x27; — причина устранена и, если нужно, building department принял работу (7159.10(a)(2)). Нарушено хоть одно условие — действуют все требования 7159(c)-(e), включая право отказа, при любой сумме (7159.10(b)). В договоре: заголовок &#x27;Service and Repair&#x27; 10 pt bold, Notice to the Buyer с 4 условиями 12 pt bold и подписью клиента, CGL и Workers&#x27; Comp notices (7159.10(d)-(e)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Preliminary Notice (mechanics lien)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Перед записью lien, stop payment notice или claim по payment bond claimant даёт preliminary notice владельцу, direct contractor и construction lender (если есть) (8200(a)). Без этого lien недействителен (8200(c)). Laborer не обязан (8200(e)(1)). Подрядчик с прямым договором с владельцем даёт notice только construction lender, если он есть (8200(e)(2)). Срок 20 дней упомянут в тексте Mechanics Lien Warning (B&amp;P 7159(e)(4)) и в Law Book. Civil Code 8204 (форма и сроки) — раздел не проверен.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Какая редакция механического кода действует и что применять к жилью</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Для HVAC в жилых домах Калифорнии работайте по 2025 California Mechanical Code (Title 24 Part 4). Он основан на 2024 UMC и действует с 1 января 2026. По CMC 1.8.2.1.1 (HCD 1) он применяется к dwellings, apartments и condominiums. Раздел CRC R807.1 о доступе на чердак прямо отсылает к CMC, если на чердаке стоит механическое оборудование. Применяется редакция, действовавшая на дату подачи заявки на permit (HSC 18938.5, по тексту errata CMC).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Подбор мощности: ACCA Manual J и Manual S</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Оборудование охлаждения для жилых зданий подбирают по ACCA Manual S под нагрузку, рассчитанную по ACCA Manual J или другим одобренным методом. Держите расчёт в пакете проекта и будьте готовы показать его инспектору.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Какая редакция Energy Code действует</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если заявку на permit подали 1 января 2026 или позже, работа должна соответствовать 2025 Energy Code (Title 24 Part 6 и Part 1 Ch.10). Цитата CEC: «Buildings whose permit applications are applied for on or after January 1, 2026, must comply with the 2025 Energy Code».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">HERS заменён на ECC; полевые тесты делает ECC-Rater</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Полевые проверки и тесты делает ECC-Rater: человек, обученный, сдавший тест и сертифицированный ECC-Provider. По словам CEC, программа ECC «replaces the HERS Program». На дату проверки CEC указывает одобренным ECC-Provider только CHEERS (одобрен 12.11.2025). Golden State Registry значится только как заявка.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Срочная замена HVAC: регистрация документов позже, но до final</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">По словам CEC, для срочных переделок (пример: HVAC changeouts) сертификаты можно зарегистрировать позже, но до закрытия или final permit. По §10-103(a)2A: для переделки жилья с полевой проверкой, если город не требует чертежей, Certificate of Compliance утверждают не до выдачи permit, а до final inspection.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Certificate of Compliance (CF1R): кто подписывает, регистрация</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Подписывает responsible person, имеющий право по Division 3 Business and Professions Code отвечать за проект. Составитель (documentation author) подписывает декларацию. Для жилья с обязательной полевой проверкой документ регистрируют в data registry ECC-Provider с электронной подписью по JA7. Для переделок без полевой проверки (водонагреватель, окна) город может документ не требовать или упростить, но нарушать код это не разрешает.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Certificate of Installation (CF2R): подписывает монтажный лицензиат или Authorized Representative</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Подписывает и подаёт лицо, отвечающее за монтаж и имеющее на это право по Division 3 B&amp;P Code. Подписать может Authorized Representative по письменному соглашению, подписанному обоими. Соглашение хранится у ECC-Provider, ответственность остаётся на лицензиате. В жилье CF2R регистрируют в data registry ECC-Provider. Копию держат с permit или на объекте для инспекций и передают владельцу.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Certificate of Verification (CF3R): подписывает только ECC-Rater</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если нужна полевая проверка, все тесты делает сертифицированный ECC-Rater (RA2, RA3, NA1, NA2). Он же заполняет, подписывает и подаёт Certificate of Verification. Подписи только электронные. Монтажник этот документ не подписывает.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Инспекция газа до закрытия и до пуска</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">По окончании работ и до использования газовой трубы уведомить AHJ. Rough-инспекция — до закрытия трубы и до подключения приборов. Газовая компания не имеет права включать газ или счётчик без сертификата финальной инспекции. Для мелкого добавления к уже подключённой трубе инспекции могут отменить на усмотрение AHJ.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Этикетка CARB: тип хладагента и год выпуска</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">С 01.01.2022 производитель оборудования из Table 3 обязан ставить заметную этикетку. Для Table 4 ((d)(2)(A)) полный список виден: тип хладагента, заряд (если известен) и как минимум 4-значный год выпуска. Список для Table 3 ((c)(4)(A)) не дочитан. Фотографируйте этикетку как доказательство даты выпуска для проверки по AIM Act и CARB.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">CA: спецматериалы из старых AC и печей</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Air-conditioner и residential furnace относятся к major appliance. Materials that require special handling (CFC, HCFC и other non-CFC replacement refrigerants, used oil, ртутные переключатели, PCB-конденсаторы и др.) нужно извлечь до того, как блок раздавят, разрежут, шредируют или выбросят. На свалку твердых отходов их сдавать нельзя. Кто извлек материал, который является hazardous waste, становится hazardous waste generator. Контроль включает CUPA.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">CA: сдача старых блоков на металлолом</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Кто везет списанные major appliances на scrap recycling facility, должен быть certified appliance recycler и подписать форму о том, что все спецматериалы удалены. В форме: номер сертификата, generator ID, число и типы блоков, куда ушли материалы. Несертифицированный перевозчик может сдать только целые, не раздавленные блоки и только на площадку, которая сама certified appliance recycler. Сертификацию выдает department по 25211.4.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Утилизация оконных и портативных AC (small appliances)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Последний в цепочке утилизации (scrap или свалка) должен сам откачать small appliance или получить подписанную расписку: имя и адрес того, кто откачал, и дата откачки. Если хладагент утек сам — расписка об утечке. Откачка small appliance: 90 % при рабочем компрессоре, 80 % при нерабочем (машины выпуска с 15.11.1993) или до 4 inches Hg vacuum. Для утилизации small appliances сертификат не нужен.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Записи при утилизации систем 5–50 lbs</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Техник, который откачивает для утилизации систему с полным зарядом больше 5 и меньше 50 lbs, хранит 3 года записи: компания, адрес установки, дата и тип хладагента по каждой системе; сколько хладагента каждого типа откачано за месяц; сколько передано на reclaim или уничтожение, кому и когда.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Уведомление DOSH перед асбестовым объектом</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Зарегистрированный работодатель перед каждым отдельным объектом подает письменное уведомление в ближайший District Office DOSH. В нем: адрес, точное место, даты начала и окончания, сертифицированный супервайзер, ответственный за замеры, описание работ. При экстренных работах — сразу устно, письменно не позже 24 часов.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Dumpster или контейнер на улице</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если контейнер или dumpster занимает улицу или тротуар, нужен Traffic Control Permit: форма DS-269 и план. Город предупредить не позже чем за 3 рабочих дня. Табличку Tow-Away/No Parking поставить за 72 часа до установки. Нельзя ставить перед красным, белым или синим бордюром. Нужны свободные расстояния от двери контейнера: 10 футов до ближайшего препятствия, 25 футов до переулка или поворота бордюра, 15 футов до гидранта. Пошлины сейчас: dumpster $176.57 в месяц, контейнер для хранения $87.68 в неделю (permit до 7 дней), обработка $87.68, заблокированный паркометр $20 в день.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Работа на улице, тротуаре, полосе парковки</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Traffic Control Permit нужен для любой работы, которая занимает тротуар, места парковки, разделительную полосу, переулок или проезжую часть. Например, кран или подъёмник ставят на улице. Город пишет, что обработка новой заявки занимает около 15 рабочих дней. Строить что-либо в public right-of-way: нужен отдельный Right-of-Way Permit. Временные таблички No Parking ставит полиция, и для эвакуации они должны стоять не меньше 24 часов.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Замена HVAC в городе San Diego требует mechanical permit</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Любую установку, изменение, замену или ремонт HVAC-системы или её части делают только с Plumbing/Mechanical Permit, если работа не попадает в освобождения §129.0404. Цитата: «No heating, ventilating, air conditioning, or refrigeration system or part thereof shall be installed, altered, replaced, or repaired unless a Plumbing/Mechanical Permit has been obtained…». На каждое здание, где ставят HVAC, нужен отдельный permit (§129.0405(b)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Что можно без mechanical permit (город)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Без permit можно: (1) ремонт оборудования без снятия с места установки и без замены неисправных controls, valves, driers, filters; (2) установка термостатов, ремонт утечек, перезаправка компрессоров или систем; (5) переносные обогреватели, вентиляторы, мобильные кондиционеры и evaporative coolers; (7) замена детали, если не меняется исходный approval прибора; (8) обслуживание холодильного оборудования в уже разрешённой системе. Замена агрегата целиком (снятие с места) под освобождение не попадает. Освобождение не разрешает нарушать код (§129.0404(b)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Освобождение от building permit не освобождает от mechanical/electrical</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если работа освобождена от building permit, это не значит, что не нужны mechanical, electrical или plumbing permits. Цитата: «The exemptions in Section 129.0203(a) are not exemptions from the electrical, plumbing, and mechanical permit requirements.»</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Аварийная замена: срок оформления permit</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Permit берут до начала работ. При аварии или срочной необходимости mechanical permit оформляют «within 2 business days of beginning work», electrical — «within 24 hours of beginning work, not including Saturdays, Sundays, and holidays».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Сроки действия mechanical permit</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Permit истекает в трёх случаях: существенная часть работы не выполнена и не подтверждена инспекцией за 180 календарных дней с выдачи; работа стоит 180 дней подряд; прошло 2 года с выдачи без финала. После истечения работа стоит до нового permit.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Нельзя отступать от описания в permit</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Ставить надо то, что описано в permit. Отступать (другая мощность, другой тип оборудования) можно только с письменного одобрения Building Official. Если установку бросили, письменно уведомить в течение 2 календарных дней (§129.0416(a)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Simple Permit (no-plan) онлайн для частного дома</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Для single-dwelling, duplex, townhouse вне исторических районов есть Simple Permit без чертежей. Он покрывает установку FAU и A/C и замену печей. Подают онлайн в Accela. Лицензированный подрядчик получает permit сразу после подачи и оплаты, owner-builder — обычно за 2 рабочих дня после DS-3042. По IB 103: исторические объекты не подходят. Если хоть один пункт объёма требует plan review, весь проект идёт с чертежами. Для Non-Residential/MDU в таблице: «Repair/Replace in Kind» = Yes, «New» = No.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Пошлины города за HVAC (IB 103)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Пошлины по Table 1B: Furnace/(FAU) — $176.57 первая единица, $52.39 каждая следующая. Heat Pump-Package Unit — $176.57 / $52.39. Air Handler, Mini-Split, Humidifier — $176.57 / $52.39. Condensing Unit for HVAC — $131.52. Mapping Fee — $12.16 (если используются планы или чертежи). Пошлины не возвращаются: «Plan check, inspection, and records fees are non-refundable.»</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Коммерция и MDU: отдельные building и MEP permits</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">«Separate building and MEP permits are required for all non-residential and Multi-Dwelling Unit (MDU) construction. Each building must have its own MEP permit.» Если в MDU или коммерции трогают гипсокартон или каркас, нужен отдельный building permit. Если ставят или меняют цепи, нужен отдельный electrical permit.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Как назначить инспекцию в городе San Diego</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Инспекцию назначают через IVR 858-581-7111 (24/7) или онлайн в Accela (Simple MEP — aca.accela.com/SANDIEGO), минимум за день. Инспекции идут по будням с 8:30 до 15:30. Отменить в день инспекции можно только через Inspection Services (7:00–16:00). Если оставить телефон в комментарии, инспектор позвонит до 10:00. Virtual inspection (Microsoft Teams) доступна только для SFD/duplex/townhome, в том числе для furnaces и heat pumps. Нужно, чтобы permit был выдан и оплачен.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">County: permit на замену и освобождения</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">В неинкорпорированных районах округа permit нужен, чтобы «install, enlarge, alter, repair, remove, convert or replace any electrical, gas, mechanical or plumbing system». Mechanical permit не нужен для: замены неисправного control, valve, drier, filter или ремонта без снятия оборудования; термостата, ремонта утечки, перезаправки; переносных приборов; «Replacing any part that does not alter its approval or make it unsafe».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">County Self-Certification Program для конденсатора</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Лицензированный подрядчик (B или C-type с действующей workers&#x27; comp, либо архитектор или инженер) может сам сертифицировать «new or replacement air conditioner condenser». Только на существующих разрешённых SFD или accessory structures. Владелец подписывает декларацию; инспектор County в ходе работ не приезжает, но возможен случайный аудит. Подают PDS 291 и PDS 136 на стойке (5510 Overland Ave, Suite 110). Если нужна HERS-проверка, прикладывают зарегистрированные CF1R/CF2R/CF3R. Готовые формы отправляют на pdsbuildingpermitcounter@sdcounty.ca.gov. Финал виден в Accela Citizen Access как «type 199 - FINAL».</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">документы, permit и сдача</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Другие города округа — свои отделы и порталы</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Permit города San Diego или County в других городах не действует. В каждом городе свой building division, портал и пошлины. Официальные домены: Chula Vista — chulavistaca.gov, Carlsbad — carlsbadca.gov, Oceanside — ci.oceanside.ca.us, Escondido — escondido.gov (в еженедельных отчётах там есть permits «HVAC REPLACEMENT»). Страницы отделов не проверены: Chula Vista, Carlsbad и Oceanside блокируют автоматический доступ.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Право отказа: 3 рабочих дня, для 65+ — 5</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Notice &#x27;Three-Day Right to Cancel&#x27; обязателен. Для senior citizen (65+, B&amp;P 7150(b)) — &#x27;Five-Day Right to Cancel&#x27;, для договоров с 01.01.2021 (7159(e)(6), (f)). Не нужен, если договор заключён в офисе подрядчика, если действует Seven-Day notice по (e)(7) или для alarm company. Оформление: 12 pt bold, рядом с подписью владельца, владелец подписывает и ставит дату, на языке устной продажи. Плюс форма &#x27;Notice of Cancellation&#x27; в двух экземплярах. При отказе подрядчик возвращает всё уплаченное в течение 10 дней. Не начинать установку при продаже на дому, пока не прошёл срок.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Service charge, старые детали и наказание</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Только ОДИН service charge (trip charge и inspection fee — это тоже service charge) (7159.14(a)(8)). Если он есть — указывать во всей рекламе, а когда клиент звонит, называть сумму (a)(9). Заменённые детали предложить клиенту (a)(10). При time &amp; materials итог не выше оценки без письменного согласия (a)(4). Нарушение (a)(1)-(6) или (8) — misdemeanor: штраф $100-$5,000 и/или до 1 года county jail (7159.14(b)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Запись разговоров с клиентом (Penal Code 632 / 632.7)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нельзя записывать &#x27;confidential communication&#x27; (лично или по телефону) без согласия ВСЕХ участников. Штраф до $2,500 за нарушение и/или тюрьма; при повторе — до $10,000 (PC 632(a)). Confidential — когда обстоятельства показывают, что участник хочет оставить разговор между собой (632(c)). Запись звонков с мобильного или cordless телефона — тоже только с согласия всех сторон, те же штрафы (632.7(a)). Практика: в начале звонка говорить &#x27;разговор записывается&#x27;; на объекте не писать звук без согласия.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Фото в доме клиента (практика)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">ПРАКТИКА, не закон. Спросить разрешения на фото. Снимать оборудование, щиток, этикетки, линии — не людей, не документы, не личные вещи. Не публиковать фото дома и адрес в рекламе без письменного согласия. Видео со звуком, где пишется разговор, подпадает под Penal Code 632.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">CCPA: порог выручки для &#x27;business&#x27;</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Компания — &#x27;business&#x27; под CCPA, в частности, если годовая валовая выручка выше порога Civil Code 1798.140(d)(1)(A). По CPI с 01.01.2025 порог — $26,625,000 (был $25,000,000). Другие пороги (100,000 потребителей, 50% выручки от продажи данных) — раздел не проверен. Практика: данные клиентов (адреса, коды ворот, фото) хранить только в рабочем приложении.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Жалоба клиента в CSLB — срок 4 года</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Жалоба на лицензиата по явным (patent) нарушениям подаётся письменно регистратору в течение 4 лет после нарушения (7091(a)(1)). Notice CSLB в договоре тоже говорит &#x27;usually four years&#x27; (7159(e)(5)). Если в договоре нет Notice of Cancellation, покупатель может жаловаться в CSLB (7159(a)(6)). За выполнение договора дисциплинарно отвечает prime/direct contractor, но субподрядчика и HIS тоже могут наказать (7159(a)(5)(B)).</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Работа без лицензии: порог $1,000 и только без permit</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Лицензия не нужна, только если выполнены все условия: весь проект вместе с материалами меньше $1,000; работа не требует building permit; это не часть большего проекта; проект не разбит на договоры, чтобы уйти от лицензии; исполнитель не рекламирует себя как подрядчика и не нанимает помощников. Брошюра CSLB Get Licensed to Build всё ещё пишет $500 — это устаревшая цифра.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Новые AH и воздуховоды на vented attic: требования к потолку</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Если ставят полностью новую систему воздуховодов, а AH и воздуховоды на вентилируемом чердаке, применяется §150.2(b)1J: утепление R-49 (CZ 1–4, 6, 8–16), air sealing потолка (CZ 2, 4, 8–16), утепление над recessed downlights (CZ 1–4, 8–16), вентиляция чердака по CRC R806. Исключения: уже есть ≥R-38; асбест; knob-and-tube. CZ 7 в списке для R-49 нет. Заранее предупредите клиента о возможном росте сметы.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">RRP: когда работа в доме до 1978 г. подпадает под правило</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">RRP применяется к работам за плату в target housing и child-occupied facilities, если нарушается окрашенная поверхность. Работа не считается renovation, если это minor repair and maintenance (в том числе minor HVAC work): не больше 6 sq ft окрашенной поверхности на комнату внутри или 20 sq ft снаружи, без запрещенных методов, без замены окон и сноса окрашенных поверхностей. Работы в одной комнате в течение 30 дней считаются одной работой.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">RRP: брошюра клиенту до начала работ</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Не раньше чем за 60 дней до начала работ дать владельцу брошюру и получить письменную расписку или certificate of mailing не позже чем за 7 дней до начала. Если владелец там не живет — то же для взрослого жильца. Экстренный ремонт (неожиданная поломка оборудования, угроза безопасности) освобожден от брошюры, но не от уборки, проверки уборки и записей.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">клиент</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">HOA и закрытые комплексы (практика)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Это практика, а не закон. Перед выездом узнать у клиента или управляющей компании HOA: где можно ставить трак, в какие часы можно шумно работать, нужен ли пропуск на въезд, нужен ли страховой сертификат (COI) и разрешение HOA на замену наружного блока. Правила HOA (CC&amp;Rs) не отменяют городские законы. Они только добавляют свои ограничения.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Работа без лицензии (unlicensed contracting)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Кто строит, меняет, ремонтирует или улучшает сооружение (сам или через других), предлагает такую работу или подаёт bid, тот &#x27;contractor&#x27;. Без лицензии CSLB это misdemeanor. Первое осуждение — штраф до $5,000 и/или до 6 месяцев county jail (7028(b)). Повторное — 20% цены контракта или выплат либо $5,000 (что больше) и не менее 90 дней (7028(c)). Не брать работу &#x27;на стороне&#x27; без лицензии.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Без лицензии нельзя взыскать оплату</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar r-1inkyih r-1q21ci" style="-webkit-line-clamp:3">Нельзя судиться за оплату, если лицензия не действовала всё время работы (7031(a)). Клиент может через суд вернуть ВСЕ деньги, уплаченные нелицензированному (7031(b)). Залог (security interest) в пользу такого лица не имеет силы (7031(c)). До начала объекта проверить, что лицензия компании active, а не suspended или expired.</div></button><button role="button" tabindex="0" class="css-g5y9jx r-1loqt21 r-1otgn73 r-1osfkhu r-orxicl r-t23y2h r-rs99b7 r-9aw3ui r-nsbfu8" type="button"><div dir="auto" class="css-146c3p1 r-1u12321 r-1b43r93 r-b88u0q r-tsynxw">бизнес и лицензия</div><div dir="auto" class="css-146c3p1 r-mm8iar r-adyw6z r-b88u0q">Исключение для мелких работ до $1,000 (B&amp;P 7048)</div><div dir="auto" class="css-146c3p1 r-8akbws r-krxsd3 r-dnmrzs r-1qsk4np r-1udbk01 r-mm8iar
